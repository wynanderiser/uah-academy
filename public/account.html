<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UAH Academy — Your Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment:#EDE6D6;
    --paper:#FBF8F2;
    --ink:#2B2621;
    --ink-soft:#5C544A;
    --moss:#5C6B4F;
    --moss-dark:#46543C;
    --clay:#A15C3E;
    --slate:#5B7C8D;
    --line:#D9CFBC;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--parchment);
    color:var(--ink);
    font-family:'Work Sans',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:56px 20px;
  }
  .card{
    width:100%;
    max-width:460px;
    background:var(--paper);
    border-radius:2px;
    padding:36px 32px;
    box-shadow:0 1px 2px rgba(43,38,33,0.06), 0 8px 24px rgba(43,38,33,0.06);
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--moss-dark);
    margin-bottom:14px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:26px;
    margin:0 0 14px 0;
  }
  .field{margin-bottom:16px;}
  .field-label{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);margin-bottom:4px;}
  .field-value{font-size:15px;}
  .status-badge{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    padding:4px 10px;
    border-radius:12px;
    background:var(--line);
    color:var(--ink-soft);
  }
  .status-badge.active{background:var(--moss);color:#fff;}
  .course-tier-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--moss-dark);
    margin-bottom:8px;
  }
  .lesson-link{
    display:block;
    padding:11px 14px;
    margin-bottom:8px;
    background:var(--parchment);
    border:1px solid var(--line);
    border-radius:2px;
    color:var(--ink);
    text-decoration:none;
    font-size:14px;
    font-weight:600;
    transition:border-color .15s ease, background .15s ease;
  }
  .lesson-link:hover{border-color:var(--moss);background:#fff;}
  .lesson-link:last-child{margin-bottom:0;}
  button{
    font-family:'Work Sans',sans-serif;
    font-weight:600;
    font-size:14px;
    background:transparent;
    color:var(--clay);
    border:1px solid var(--clay);
    padding:10px 18px;
    border-radius:2px;
    cursor:pointer;
    margin-top:10px;
  }
  button:hover{background:var(--clay);color:#fff;}
  .loading{color:var(--ink-soft);font-size:14px;}
  .tier{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);}
  .tier-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px;}
  .tier-head h2{font-family:'Fraunces',serif;font-weight:500;font-size:20px;margin:0;}
  .tier-note{font-size:13.5px;color:var(--ink-soft);margin:6px 0 0 0;line-height:1.5;}
  .buy{background:var(--moss);color:#fff;border:none;width:100%;min-height:44px;}
  .buy:hover{background:var(--moss-dark);color:#fff;}
  .buy:disabled{background:var(--line);color:var(--ink-soft);cursor:not-allowed;}
  .notice{padding:12px 14px;margin-bottom:16px;font-size:14px;line-height:1.5;border-left:3px solid var(--moss);background:#EEF1E8;}
  .notice.warn{border-color:var(--clay);background:#F6E9E4;}
  .credits{font-family:'Fraunces',serif;font-size:28px;line-height:1;}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="eyebrow">UAH Academy</div>
  <h1>Your account</h1>
  <p class="loading" id="loading">Checking your login…</p>
</div>

<script>
const card = document.getElementById('card');

const TIERS = [
  { key: 'beginner', name: 'Beginner', requires: null, lessons: [
    ['lesson1', 'Lesson 1: One Object, One Light'],
    ['lesson2', 'Lesson 2: Two Objects, One Light'],
    ['lesson3', 'Lesson 3: Line & Edges'],
    ['lesson4', 'Lesson 4: Simple Still Life'],
    ['lesson5', 'Lesson 5: Foreground & Background'],
    ['lesson6', 'Lesson 6: First Finished Piece']
  ]},
  { key: 'intermediate', name: 'Intermediate', requires: ['lesson6', 'Beginner'], lessons: [
    ['intermediate1', 'Lesson 1: Perspective Basics'],
    ['intermediate2', 'Lesson 2: Life vs Reference'],
    ['intermediate3', 'Lesson 3: Composition in Depth'],
    ['intermediate4', 'Lesson 4: Colour Basics'],
    ['intermediate5', 'Lesson 5: Negative Space and Framing'],
    ['intermediate6', 'Lesson 6: Short Themed Series']
  ]},
  { key: 'advanced', name: 'Advanced', requires: ['intermediate6', 'Intermediate'], lessons: [
    ['advanced1', 'Lesson 1: Refining a Personal Voice'],
    ['advanced2', 'Lesson 2: Larger, Ambitious Pieces'],
    ['advanced3', 'Lesson 3: Critique-Driven Iteration'],
    ['advanced4', 'Lesson 4: Presenting & Framing'],
    ['advanced5', 'Lesson 5: Preparing for Exhibition']
  ]}
];

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

async function startCheckout(product, button) {
  const label = button.textContent;
  button.disabled = true;
  button.textContent = 'Opening checkout…';
  try {
    const response = await fetch('/api/create-checkout-session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ product })
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || 'Something went wrong.');
    window.location.href = result.url;
  } catch (err) {
    alert(err.message);
    button.disabled = false;
    button.textContent = label;
  }
}

(async function loadAccount(){
  const meResponse = await fetch('/api/auth/me');
  const data = await meResponse.json();

  if (!data.loggedIn) {
    card.innerHTML = `
      <div class="eyebrow">UAH Academy</div>
      <h1>Not logged in</h1>
      <p style="font-size:14.5px;color:var(--ink-soft);">Your session may have expired. <a href="login.html">Log in again</a>.</p>
    `;
    return;
  }

  let passed = new Set();
  try {
    const progress = await (await fetch('/api/lessons/progress')).json();
    passed = new Set(progress.passed || []);
  } catch (e) { /* progress only affects which tiers can be bought */ }

  const owned = new Set(data.ownedTiers || []);
  const params = new URLSearchParams(window.location.search);
  let notice = '';
  if (params.get('checkout') === 'success') {
    notice = `<div class="notice">Thank you, your payment went through. It can take a few seconds to appear here; if it hasn't, <a href="account.html">refresh this page</a>.</div>`;
  } else if (params.get('checkout') === 'cancelled') {
    notice = `<div class="notice warn">Checkout was cancelled and you haven't been charged.</div>`;
  }

  const tiersHtml = TIERS.map(tier => {
    if (owned.has(tier.key)) {
      return `
        <div class="tier">
          <div class="tier-head"><h2>${tier.name}</h2><span class="status-badge active">Yours</span></div>
          ${tier.lessons.map(([slug, title]) => `<a href="${slug}.html" class="lesson-link">${escapeHtml(title)}${passed.has(slug) ? ' ✓' : ''}</a>`).join('')}
        </div>`;
    }
    const unlocked = !tier.requires || passed.has(tier.requires[0]) || data.isAdmin;
    return `
      <div class="tier">
        <div class="tier-head"><h2>${tier.name}</h2><span class="field-value">£60</span></div>
        <p class="tier-note" style="margin:0 0 12px 0;">${tier.lessons.length} lessons and 25 tutor conversations. One-off payment.</p>
        <button class="buy" data-product="tier:${tier.key}" ${unlocked ? '' : 'disabled'}>Get the ${tier.name} tier for £60</button>
        ${unlocked ? '' : `<p class="tier-note">Opens once you've completed the ${tier.requires[1]} tier.</p>`}
      </div>`;
  }).join('');

  const hasAnyTier = owned.size > 0;
  const creditsHtml = data.isAdmin ? '' : `
    <div class="field" style="margin-top:20px;">
      <div class="field-label">Tutor conversations left</div>
      <div class="credits">${data.conversationCredits || 0}</div>
      <p class="tier-note">One conversation is one upload of your work plus the follow-up that comes with it.</p>
      ${hasAnyTier ? `<button class="buy" data-product="credits:5" style="margin-top:12px;background:transparent;color:var(--moss-dark);border:1px solid var(--moss);">Top up 5 more for £4</button>` : ''}
    </div>`;

  card.innerHTML = `
    <div class="eyebrow">UAH Academy</div>
    <h1>Your account</h1>
    ${notice}
    <div class="field">
      <div class="field-label">Email</div>
      <div class="field-value">${escapeHtml(data.email)}</div>
      ${data.isAdmin ? '<span class="status-badge" style="background:var(--clay);color:#fff;margin-top:8px;">Admin access</span>' : ''}
    </div>
    ${creditsHtml}
    ${tiersHtml}
    <div style="margin-top:24px;padding-top:16px;border-top:1px solid var(--line);font-size:14px;">
      <a href="uah-side-shoots-gallery.html">Browse side-shoots</a>
    </div>
    <button id="logoutBtn" style="margin-top:16px;">Log out</button>
  `;

  card.querySelectorAll('button[data-product]').forEach(btn => {
    btn.addEventListener('click', () => startCheckout(btn.dataset.product, btn));
  });
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await fetch('/api/auth/logout', { method: 'POST' });
    window.location.href = 'login.html';
  });
})().catch(() => {
  card.innerHTML = `<div class="eyebrow">UAH Academy</div><h1>Something went wrong</h1><p style="font-size:14.5px;color:var(--ink-soft);">Could not load your account. Please refresh the page.</p>`;
});
</script>
</body>
</html>
