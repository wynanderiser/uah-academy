<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UAH Academy — Your Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment:#EDE6D6;
    --paper:#FBF8F2;
    --ink:#2B2621;
    --ink-soft:#5C544A;
    --moss:#5C6B4F;
    --moss-dark:#46543C;
    --clay:#A15C3E;
    --slate:#5B7C8D;
    --line:#D9CFBC;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--parchment);
    color:var(--ink);
    font-family:'Work Sans',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:56px 20px;
  }
  .card{
    width:100%;
    max-width:420px;
    background:var(--paper);
    border-radius:2px;
    padding:36px 32px;
    box-shadow:0 1px 2px rgba(43,38,33,0.06), 0 8px 24px rgba(43,38,33,0.06);
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--moss-dark);
    margin-bottom:14px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:26px;
    margin:0 0 14px 0;
  }
  .field{margin-bottom:16px;}
  .field-label{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);margin-bottom:4px;}
  .field-value{font-size:15px;}
  .status-badge{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    padding:4px 10px;
    border-radius:12px;
    background:var(--line);
    color:var(--ink-soft);
  }
  .status-badge.active{background:var(--moss);color:#fff;}
  button{
    font-family:'Work Sans',sans-serif;
    font-weight:600;
    font-size:14px;
    background:transparent;
    color:var(--clay);
    border:1px solid var(--clay);
    padding:10px 18px;
    border-radius:2px;
    cursor:pointer;
    margin-top:10px;
  }
  button:hover{background:var(--clay);color:#fff;}
  .loading{color:var(--ink-soft);font-size:14px;}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="eyebrow">UAH Academy</div>
  <h1>Your account</h1>
  <p class="loading" id="loading">Checking your login…</p>
</div>

<script>
const card = document.getElementById('card');

fetch('/api/auth/me')
  .then(r => r.json())
  .then(data => {
    if (!data.loggedIn) {
      card.innerHTML = `
        <div class="eyebrow">UAH Academy</div>
        <h1>Not logged in</h1>
        <p style="font-size:14.5px;color:var(--ink-soft);">Your session may have expired. <a href="login.html">Log in again</a>.</p>
      `;
      return;
    }
    const isActive = data.subscriptionStatus === 'active';
    card.innerHTML = `
      <div class="eyebrow">UAH Academy</div>
      <h1>You're logged in</h1>
      <div class="field">
        <div class="field-label">Email</div>
        <div class="field-value">${data.email}</div>
      </div>
      <div class="field">
        <div class="field-label">Membership</div>
        <span class="status-badge ${isActive ? 'active' : ''}">${data.subscriptionStatus || 'inactive'}</span>
      </div>
      <button id="logoutBtn">Log out</button>
    `;
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = 'login.html';
    });
  })
  .catch(() => {
    card.innerHTML = `<div class="eyebrow">UAH Academy</div><h1>Something went wrong</h1><p style="font-size:14.5px;color:var(--ink-soft);">Could not check your login status. Please try again.</p>`;
  });
</script>
</body>
</html>
