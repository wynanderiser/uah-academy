<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UAH Academy — Your Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment:#EDE6D6;
    --paper:#FBF8F2;
    --ink:#2B2621;
    --ink-soft:#5C544A;
    --moss:#5C6B4F;
    --moss-dark:#46543C;
    --clay:#A15C3E;
    --slate:#5B7C8D;
    --line:#D9CFBC;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--parchment);
    color:var(--ink);
    font-family:'Work Sans',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:56px 20px;
  }
  .card{
    width:100%;
    max-width:420px;
    background:var(--paper);
    border-radius:2px;
    padding:36px 32px;
    box-shadow:0 1px 2px rgba(43,38,33,0.06), 0 8px 24px rgba(43,38,33,0.06);
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--moss-dark);
    margin-bottom:14px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:26px;
    margin:0 0 14px 0;
  }
  .field{margin-bottom:16px;}
  .field-label{font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);margin-bottom:4px;}
  .field-value{font-size:15px;}
  .status-badge{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    padding:4px 10px;
    border-radius:12px;
    background:var(--line);
    color:var(--ink-soft);
  }
  .status-badge.active{background:var(--moss);color:#fff;}
  .course-tier-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--moss-dark);
    margin-bottom:8px;
  }
  .lesson-link{
    display:block;
    padding:11px 14px;
    margin-bottom:8px;
    background:var(--parchment);
    border:1px solid var(--line);
    border-radius:2px;
    color:var(--ink);
    text-decoration:none;
    font-size:14px;
    font-weight:600;
    transition:border-color .15s ease, background .15s ease;
  }
  .lesson-link:hover{border-color:var(--moss);background:#fff;}
  .lesson-link:last-child{margin-bottom:0;}
  button{
    font-family:'Work Sans',sans-serif;
    font-weight:600;
    font-size:14px;
    background:transparent;
    color:var(--clay);
    border:1px solid var(--clay);
    padding:10px 18px;
    border-radius:2px;
    cursor:pointer;
    margin-top:10px;
  }
  button:hover{background:var(--clay);color:#fff;}
  .loading{color:var(--ink-soft);font-size:14px;}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="eyebrow">UAH Academy</div>
  <h1>Your account</h1>
  <p class="loading" id="loading">Checking your login…</p>
</div>

<script>
const card = document.getElementById('card');

(async function loadAccount(){
  const meResponse = await fetch('/api/auth/me');
  const data = await meResponse.json();

  if (!data.loggedIn) {
    card.innerHTML = `
      <div class="eyebrow">UAH Academy</div>
      <h1>Not logged in</h1>
      <p style="font-size:14.5px;color:var(--ink-soft);">Your session may have expired. <a href="login.html">Log in again</a>.</p>
    `;
    return;
  }
  const isActive = data.subscriptionStatus === 'active';
  const isPaused = data.subscriptionStatus === 'paused';

  let founderHtml = '';
  if (!isActive && !isPaused) {
    try {
      const slotsResponse = await fetch('/api/founder-slots');
      const slots = await slotsResponse.json();
      if (slots.available) {
        const pct = slots.percentOff ? Math.round(slots.percentOff) : '';
        founderHtml = `
          <div style="margin-bottom:14px;padding:12px 14px;background:#F6E9E4;border-left:3px solid var(--clay);">
            <p style="font-size:13px;color:var(--ink);margin:0;"><b>Founder Member rate:</b> ${pct}% off your first 3 months (or your first year, paid annually) — just ${slots.remaining} of ${slots.cap} spots left.</p>
          </div>
        `;
      }
    } catch (e) {
      // if this fails, the standard prices below still work fine — no need to block on it
    }
  }

  const subscribeHtml = (isActive || isPaused) ? '' : `
    <div class="field" style="margin-top:24px;padding-top:20px;border-top:1px solid var(--line);">
      <div class="field-label" style="margin-bottom:10px;">Ready to enrol?</div>
      ${founderHtml}
      <button id="subscribeMonthlyBtn" style="background:var(--moss);color:#fff;border:none;width:100%;margin-bottom:8px;">£15/month</button>
      <button id="subscribeAnnualBtn" style="background:transparent;color:var(--moss-dark);border:1px solid var(--moss);width:100%;">£150/year (save two months)</button>
    </div>
  `;
  const memberAreaHtml = isActive ? `
    <div class="field" style="margin-top:24px;padding-top:20px;border-top:1px solid var(--line);">
      <div class="course-tier-label">Your course — Beginner</div>
      <a href="lesson1.html" class="lesson-link">Lesson 1: One Object, One Light</a>
      <a href="lesson2.html" class="lesson-link">Lesson 2: Two Objects, One Light</a>
      <a href="lesson3.html" class="lesson-link">Lesson 3: Line & Edges</a>
      <a href="lesson4.html" class="lesson-link">Lesson 4: Simple Still Life</a>
      <a href="lesson5.html" class="lesson-link">Lesson 5: Foreground &amp; Background</a>
      <a href="lesson6.html" class="lesson-link">Lesson 6: First Finished Piece</a>
    </div>
    <div class="field" style="margin-top:20px;">
      <div class="course-tier-label">Your course — Intermediate</div>
      <a href="intermediate1.html" class="lesson-link">Lesson 1: Perspective Basics</a>
      <a href="intermediate2.html" class="lesson-link">Lesson 2: Life vs Reference</a>
      <a href="intermediate3.html" class="lesson-link">Lesson 3: Composition in Depth</a>
      <a href="intermediate4.html" class="lesson-link">Lesson 4: Colour Basics</a>
      <a href="intermediate5.html" class="lesson-link">Lesson 5: Negative Space and Framing</a>
      <a href="intermediate6.html" class="lesson-link">Lesson 6: Short Themed Series</a>
    </div>
    <div class="field" style="margin-top:20px;">
      <div class="course-tier-label">Your course — Advanced</div>
      <a href="advanced1.html" class="lesson-link">Lesson 1: Refining a Personal Voice</a>
      <a href="advanced2.html" class="lesson-link">Lesson 2: Larger, Ambitious Pieces</a>
      <a href="advanced3.html" class="lesson-link">Lesson 3: Critique-Driven Iteration</a>
      <a href="advanced4.html" class="lesson-link">Lesson 4: Presenting &amp; Framing</a>
      <a href="advanced5.html" class="lesson-link">Lesson 5: Preparing for Exhibition</a>
    </div>
    <div class="field" style="margin-top:20px;padding-top:16px;border-top:1px solid var(--line);">
      <button id="pauseBtn" style="background:transparent;color:var(--ink-soft);border:1px solid var(--line);width:100%;">Pause my membership</button>
      <div id="pauseConfirm" style="display:none;margin-top:10px;padding:12px;background:var(--parchment);border-radius:2px;">
        <p style="font-size:13px;color:var(--ink);margin:0 0 10px 0;">Pausing stops billing immediately and holds your access until you resume — your progress stays exactly as it is. Are you sure?</p>
        <button id="pauseConfirmYes" style="background:var(--clay);color:#fff;border:none;width:48%;margin-right:4%;">Yes, pause it</button>
        <button id="pauseConfirmNo" style="background:transparent;color:var(--ink-soft);border:1px solid var(--line);width:48%;">Never mind</button>
      </div>
    </div>
  ` : '';
  const pausedHtml = isPaused ? `
    <div class="field" style="margin-top:24px;padding-top:20px;border-top:1px solid var(--line);">
      <p style="font-size:14px;color:var(--ink);margin:0 0 14px 0;">Your membership is paused — nothing's being charged, and your progress is exactly where you left it. Resume whenever you're ready.</p>
      <button id="resumeBtn" style="background:var(--moss);color:#fff;border:none;width:100%;">Resume my membership</button>
      <p id="resumeStatus" style="font-size:13px;color:var(--ink-soft);margin:10px 0 0 0;"></p>
    </div>
  ` : '';
  card.innerHTML = `
    <div class="eyebrow">UAH Academy</div>
    <h1>You're logged in</h1>
    <div class="field">
      <div class="field-label">Email</div>
      <div class="field-value">${data.email}</div>
    </div>
    <div class="field">
      <div class="field-label">Membership</div>
      <span class="status-badge ${isActive ? 'active' : ''}">${data.subscriptionStatus || 'inactive'}</span>
      ${data.isAdmin ? '<span class="status-badge" style="background:var(--clay);color:#fff;margin-left:6px;">Admin access</span>' : ''}
    </div>
    ${memberAreaHtml}
    ${pausedHtml}
    ${subscribeHtml}
    <button id="logoutBtn" style="margin-top:16px;">Log out</button>
  `;
  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await fetch('/api/auth/logout', { method: 'POST' });
    window.location.href = 'login.html';
    });

    async function startCheckout(plan) {
      const response = await fetch('/api/create-checkout-session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ plan })
      });
      const result = await response.json();
      if (!response.ok) { alert(result.error || 'Something went wrong.'); return; }
      window.location.href = result.url;
    }
    const monthlyBtn = document.getElementById('subscribeMonthlyBtn');
    const annualBtn = document.getElementById('subscribeAnnualBtn');
    if (monthlyBtn) monthlyBtn.addEventListener('click', () => startCheckout('monthly'));
    if (annualBtn) annualBtn.addEventListener('click', () => startCheckout('annual'));

    const pauseBtn = document.getElementById('pauseBtn');
    if (pauseBtn) {
      pauseBtn.addEventListener('click', () => {
        pauseBtn.style.display = 'none';
        document.getElementById('pauseConfirm').style.display = 'block';
      });
      document.getElementById('pauseConfirmNo').addEventListener('click', () => {
        document.getElementById('pauseConfirm').style.display = 'none';
        pauseBtn.style.display = 'block';
      });
      document.getElementById('pauseConfirmYes').addEventListener('click', async (e) => {
        e.target.disabled = true;
        e.target.textContent = 'Pausing…';
        try {
          const response = await fetch('/api/pause-membership', { method: 'POST' });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || 'Something went wrong.');
          window.location.reload();
        } catch (err) {
          alert(err.message);
          e.target.disabled = false;
          e.target.textContent = 'Yes, pause it';
        }
      });
    }

    const resumeBtn = document.getElementById('resumeBtn');
    if (resumeBtn) {
      resumeBtn.addEventListener('click', async () => {
        resumeBtn.disabled = true;
        resumeBtn.textContent = 'Resuming…';
        const statusEl = document.getElementById('resumeStatus');
        try {
          const response = await fetch('/api/resume-membership', { method: 'POST' });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || 'Something went wrong.');
          window.location.reload();
        } catch (err) {
          statusEl.textContent = err.message;
          resumeBtn.disabled = false;
          resumeBtn.textContent = 'Resume my membership';
        }
      });
    }
})().catch(() => {
  card.innerHTML = `<div class="eyebrow">UAH Academy</div><h1>Something went wrong</h1><p style="font-size:14.5px;color:var(--ink-soft);">Could not check your login status. Please try again.</p>`;
});
</script>
</body>
</html>
